<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tirex38 — مغامرة تيسمسيلت 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86c8f4;font-family:system-ui,-apple-system,Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none;gap:8px}
.pill{background:#071522d9;border:1px solid #ffffff55;border-radius:14px;padding:7px 12px;font-weight:900;text-shadow:0 2px 4px #000;box-shadow:0 4px 16px #0004;font-size:clamp(13px,3.5vw,19px)}
#brand{font-size:clamp(18px,5vw,29px);font-style:italic;color:#9eff32}#brand small{display:block;color:#fff;font-size:11px}
#message{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#071522d9;border:1px solid #ffffff66;border-radius:20px;padding:20px;max-width:85%;width:340px;box-shadow:0 10px 40px #0007}
#message h1{margin:0 0 6px;font-size:28px;color:#aaff37}#message p{margin:6px 0 16px;line-height:1.7}
button{font:inherit;color:white;background:#087b47;border:2px solid #caff77;border-radius:14px;padding:12px 18px;font-weight:900;box-shadow:0 5px 0 #034d2c;touch-action:manipulation}
#controls{position:absolute;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;display:flex;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:5px;pointer-events:auto}
.pad button,.actions button{background:#071522b8;border:2px solid #ffffff99;box-shadow:0 4px 0 #0007;padding:0;font-size:24px;border-radius:50%;width:56px;height:56px}
#left{grid-column:1;grid-row:2}#right{grid-column:3;grid-row:2}#jump{grid-column:2;grid-row:1}
.actions{display:flex;flex-direction:column;gap:9px;pointer-events:auto}.actions button{font-size:13px;width:66px;height:60px;border-radius:18px}
#hint{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);font-size:12px;background:#0715229c;border-radius:12px;padding:6px 10px;white-space:nowrap}
@media(min-width:800px){#controls{padding:24px}.pad button{width:64px;height:64px}.actions button{width:74px;height:68px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill" id="brand">TIREX<span style="color:#fff">38</span><small>مغامرة تيسمسيلت 🇩🇿</small></div><div class="pill">🏆 <span id="score">0</span></div><div class="pill">🪙 <span id="coins">0</span></div></div>
<div id="message"><h1>TIREX38</h1><p>مغامرة ثلاثية الأبعاد في تيسمسيلت<br>تفادَ السيارات واجمع القطع الذهبية!</p><button id="start">ابدأ اللعب ▶</button></div>
<div id="hint">اسحب يمين/يسار أو استعمل الأزرار • اقفز لتفادي الحواجز</div>
<div id="controls"><div class="pad"><button id="jump" aria-label="قفز">⬆</button><button id="left" aria-label="يسار">◀</button><button id="right" aria-label="يمين">▶</button></div><div class="actions"><button id="boost">⚡<br>سرعة</button><button id="shield">🛡️<br>حماية</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8bcaf4); scene.fog=new THREE.Fog(0x8bcaf4,55,210);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,400); camera.position.set(0,5.3,11.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x536044,2.0));
const sun=new THREE.DirectionalLight(0xfff0d1,3);sun.position.set(-12,22,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const roadMat=mat(0x343a3c),white=mat(0xf6f2dc),grass=mat(0x688b48),rock=mat(0x68796a),dark=mat(0x17232c),gold=mat(0xffb900,.3,.55);
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,260),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,-.06,-95);road.receiveShadow=true;scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,300),grass);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.18,-100);scene.add(ground);
const laneMarks=[];for(let z=20;z>-220;z-=8)for(let x of [-2.05,2.05]){let m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,3.5),white);m.position.set(x,.01,z);scene.add(m);laneMarks.push(m)}
// mountains and town silhouette
for(let side of [-1,1]){for(let i=0;i<17;i++){let h=7+Math.random()*18,w=8+Math.random()*10;let m=new THREE.Mesh(new THREE.ConeGeometry(w,h,5),mat(i%3?0x617e68:0x84968b));m.position.set(side*(13+Math.random()*24),h/2-1,-25-i*12-Math.random()*8);m.rotation.y=Math.random()*1.5;m.castShadow=true;scene.add(m)}}
const buildings=[];for(let i=0;i<25;i++){let side=i%2?1:-1;let b=new THREE.Group();let w=2+Math.random()*2,h=2+Math.random()*5;let body=new THREE.Mesh(new THREE.BoxGeometry(w,h,2.5),mat([0xe5d5b4,0xd4c3a3,0xf1e5d1,0xc4c9bd][i%4]));body.position.y=h/2;b.add(body);for(let y=1;y<h-.3;y+=1.1)for(let x=-w/2+.4;x<w/2;x+=.8){let win=new THREE.Mesh(new THREE.BoxGeometry(.24,.35,.04),mat(0x4a7183,.5));win.position.set(x,y,1.27);b.add(win)}b.position.set(side*(8+Math.random()*9),0,-20-i*7);scene.add(b);buildings.push(b)}
function labelTexture(lines,bg='#07523c',fg='#fff'){let c=document.createElement('canvas');c.width=512;c.height=180;let x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,180);x.strokeStyle='#e8eee1';x.lineWidth=8;x.strokeRect(5,5,502,170);x.textAlign='center';x.fillStyle=fg;x.font='bold 38px Arial';x.fillText(lines[0],256,68);x.font='bold 30px Arial';x.fillText(lines[1]||'',256,117);x.font='bold 22px Arial';x.fillText('↑',450,145);let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function sign(x,z,lines){let g=new THREE.Group();let board=new THREE.Mesh(new THREE.BoxGeometry(4.8,1.65,.18),mat(0x07523c));board.position.y=5;g.add(board);let face=new THREE.Mesh(new THREE.PlaneGeometry(4.6,1.45),new THREE.MeshBasicMaterial({map:labelTexture(lines),side:THREE.DoubleSide}));face.position.set(0,5,.1);g.add(face);for(let px of [-1.7,1.7]){let pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,5,8),mat(0x777e7d));pole.position.set(px,2.5,0);g.add(pole)}g.position.set(x,0,z);scene.add(g)}
sign(-5,-32,['تيسمسيلت','TISSEMSILT']);sign(5,-58,['ثنية الحد','THENIET EL HAD']);sign(-5,-87,['المداد','EL MEDAD']);
// Algerian flags
function flag(x,z){let p=new THREE.Group();let pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,3.5,8),mat(0xdddddd));pole.position.y=1.75;p.add(pole);let f=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.9),[mat(0x087b45),mat(0xffffff)]);f.position.set(.75,2.7,0);p.add(f);let star=new THREE.Mesh(new THREE.CircleGeometry(.18,5),mat(0xd51f35));star.position.set(.75,2.7,.02);p.add(star);p.position.set(x,0,z);scene.add(p)}flag(-7,-18);flag(7,-45);
function car(color,kind){let g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.65,.58,3),mat(color,.35,.18));body.position.y=.65;body.castShadow=true;g.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.58,.18,.85),mat(color,.3,.15));hood.position.set(0,.88,-.92);g.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.25,.58,1.42),mat(0x263b49,.25,.15));cabin.position.set(0,1.15,.15);g.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.12,.09,1.1),mat(color,.35,.1));roof.position.set(0,1.47,.15);g.add(roof);for(let z of [-.95,1])for(let x of [-.84,.84]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.15,16),dark);w.rotation.z=Math.PI/2;w.position.set(x,.38,z);g.add(w)}for(let x of [-.48,.48]){let l=new THREE.Mesh(new THREE.BoxGeometry(.25,.14,.04),mat(0xfff1ce));l.position.set(x,.68,-1.51);g.add(l);let r=new THREE.Mesh(new THREE.BoxGeometry(.25,.14,.04),mat(0xd21f19));r.position.set(x,.68,1.51);g.add(r)}const plate=new THREE.Mesh(new THREE.BoxGeometry(.62,.15,.035),mat(0xf4d34e));plate.position.set(0,.55,1.53);g.add(plate);const canvas=document.createElement('canvas');canvas.width=256;canvas.height=64;let ctx=canvas.getContext('2d');ctx.fillStyle='#f2d44c';ctx.fillRect(0,0,256,64);ctx.fillStyle='#111';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('03816 119 38',128,43);let tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;let plateText=new THREE.Mesh(new THREE.PlaneGeometry(.58,.12),new THREE.MeshBasicMaterial({map:tex}));plateText.position.set(0,.55,1.552);g.add(plateText);let tag=new THREE.Mesh(new THREE.PlaneGeometry(.8,.22),new THREE.MeshBasicMaterial({map:textTex(kind),transparent:true,side:THREE.DoubleSide}));tag.position.set(0,1.18,.88);g.add(tag);return g}
function textTex(s){let c=document.createElement('canvas');c.width=256;c.height=64;let x=c.getContext('2d');x.fillStyle='#ffffff';x.font='bold 35px Arial';x.textAlign='center';x.fillText(s,128,45);let t=new THREE.CanvasTexture(c);return t}
const traffic=[],carKinds=[['SYMBOL',0xb8bdc2],['DACIA',0xe5e7e8],['TOYOTA',0xa72020],['CHEVROLET',0x1555a0],['MARUTI',0x111d2b],['ATOS',0xe3b51c]];
function addTraffic(z){let lane=[-3.7,0,3.7][Math.floor(Math.random()*3)],data=carKinds[Math.floor(Math.random()*carKinds.length)],g=car(data[1],data[0]);g.position.set(lane,0,z);g.scale.setScalar(.85+Math.random()*.2);scene.add(g);traffic.push({g,z,lane})}
for(let i=0;i<8;i++)addTraffic(-15-i*20);
const player=new THREE.Group();scene.add(player);player.position.set(0,0,4);
const skin=mat(0xb77b53),shirt1=mat(0x078443),shirt2=mat(0xffffff),pants=mat(0x18202a),shoe=mat(0xeeeeee);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,5,8),shirt1);torso.position.y=1.35;player.add(torso);const shirtWhite=new THREE.Mesh(new THREE.BoxGeometry(.32,.6,.38),shirt2);shirtWhite.position.set(.22,1.35,0);player.add(shirtWhite);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.y=2.05;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8,0,Math.PI*2,0,Math.PI/2),dark);hair.position.y=2.15;player.add(hair);
const legs=[];for(let x of [-.18,.18]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.56,4,7),pants);leg.position.set(x,.55,0);player.add(leg);legs.push(leg);let foot=new THREE.Mesh(new THREE.BoxGeometry(.23,.12,.38),shoe);foot.position.set(x,.13,-.1);player.add(foot)}
const coins3d=[];for(let i=0;i<14;i++){let c=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,8,20),gold);c.position.set([-3.7,0,3.7][i%3],1.3,-18-i*9);c.rotation.y=Math.PI/2;scene.add(c);coins3d.push(c)}
const barriers=[];function barrier(z){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(2,.8,.5),mat(0xe5e5dc));b.position.y=.5;g.add(b);for(let i=-.7;i<.9;i+=.7){let stripe=new THREE.Mesh(new THREE.BoxGeometry(.22,.85,.54),mat(0xc92d23));stripe.position.set(i,.5,0);stripe.rotation.z=-.25;g.add(stripe)}g.position.set([-3.7,0,3.7][Math.floor(Math.random()*3)],0,z);scene.add(g);barriers.push(g)}for(let i=0;i<5;i++)barrier(-40-i*35);
let lane=1,score=0,coins=0,running=false,over=false,jump=0,shieldTime=0,boostTime=0,speed=21,last=0,spawnTimer=0;
const $=s=>document.querySelector(s);function updateHud(){$('#score').textContent=Math.floor(score);$('#coins').textContent=coins}
function start(){score=0;coins=0;lane=1;speed=21;jump=0;shieldTime=0;boostTime=0;over=false;running=true;player.position.x=0;$('#message').style.display='none';last=performance.now()}
function end(){running=false;over=true;$('#message').innerHTML='<h1>انتهت الجولة!</h1><p>نقاطك: '+Math.floor(score)+'<br>القطع الذهبية: '+coins+'</p><button id="start">العب مجدداً ↻</button>';$('#message').style.display='block';$('#start').onclick=start}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d))}
function hop(){if(running&&jump<=0)jump=1.15}
$('#start').onclick=start;$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);$('#jump').onclick=hop;$('#boost').onclick=()=>{if(running)boostTime=2.5};$('#shield').onclick=()=>{if(running)shieldTime=4};
let touchX=null;renderer.domElement.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});renderer.domElement.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>35)move(dx>0?1:-1);else hop();touchX=null},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='ArrowUp')hop()});
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000||0,.04);last=t;if(running){speed=21+(boostTime>0?10:0);boostTime=Math.max(0,boostTime-dt);shieldTime=Math.max(0,shieldTime-dt);score+=dt*speed;player.position.x+=( [-3.7,0,3.7][lane]-player.position.x)*Math.min(1,dt*12);if(jump>0){jump-=dt;player.position.y=Math.sin((1.15-jump)/1.15*Math.PI)*1.8;if(jump<=0)player.position.y=0}else player.position.y=0;legs.forEach((l,i)=>{l.rotation.x=Math.sin(t*.014+i*Math.PI)*.65});laneMarks.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>18)m.position.z-=240});traffic.forEach(o=>{o.z+=speed*dt;o.g.position.z=o.z;if(o.z>10){scene.remove(o.g);o.z=-170-Math.random()*50;o.lane=[-3.7,0,3.7][Math.floor(Math.random()*3)];let d=carKinds[Math.floor(Math.random()*carKinds.length)];scene.add(o.g);o.g.position.set(o.lane,0,o.z)}});barriers.forEach(b=>{b.position.z+=speed*dt;if(b.position.z>10){b.position.z=-140-Math.random()*40;b.position.x=[-3.7,0,3.7][Math.floor(Math.random()*3)]}if(Math.abs(b.position.z-player.position.z)<1.3&&Math.abs(b.position.x-player.position.x)<1.25&&player.position.y<.8&&!shieldTime)end()});coins3d.forEach(c=>{c.position.z+=speed*dt;c.rotation.y+=dt*3;if(c.position.z>8){c.position.z=-120-Math.random()*80;c.position.x=[-3.7,0,3.7][Math.floor(Math.random()*3)]}if(!c.userData.got&&Math.abs(c.position.z-player.position.z)<1.4&&Math.abs(c.position.x-player.position.x)<1.3){coins++;c.userData.got=true;c.visible=false;setTimeout(()=>{c.userData.got=false;c.visible=true},800);updateHud()}});updateHud()}camera.position.x+=(player.position.x*.18-camera.position.x)*dt;camera.lookAt(player.position.x*.2,1,-12);renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
